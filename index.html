<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#00704A">
<title>SBUX 供應商簡報</title>
<style>
:root{
  --green:#00704A; --green-dark:#005538; --green-light:#edf7f2;
  --high-bg:#fff0f0; --high-col:#c0392b; --high-brd:#f5c6cb;
  --med-bg:#fffbec;  --med-col:#b7770d;  --med-brd:#fde68a;
  --low-bg:#eef6fd;  --low-col:#1a6fa8;  --low-brd:#bee3f8;
  --sidebar:220px; --topbar:56px; --daytab:48px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Noto Sans TC',sans-serif;
  background:#f2f2ed;color:#1a1a1a;font-size:15px;line-height:1.6;overscroll-behavior:none}

/* ════════ SIDEBAR (desktop only) ════════ */
#sidebar{
  display:none;
  width:var(--sidebar);background:#1a1a1a;color:#fff;
  position:fixed;top:0;left:0;bottom:0;z-index:200;
  flex-direction:column;overflow-y:auto}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid #2a2a2a}
.sb-logo-row{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.sb-icon{width:32px;height:32px;background:var(--green);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sb-name{font-size:13.5px;font-weight:700;line-height:1.3}
.sb-sub{font-size:10px;color:#777;padding:8px 16px;border-bottom:1px solid #222}
.sb-days{flex:1;padding:6px 0}
.sb-day{display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;cursor:pointer;border-left:3px solid transparent;
  font-size:13px;color:#aaa;transition:all .15s}
.sb-day:hover{background:#262626;color:#fff}
.sb-day.active{background:#1e3328;border-left-color:var(--green);color:#fff}
.sb-day-name{font-weight:600;font-size:13px}
.sb-day-cnt{font-size:10px;background:#2a2a2a;color:#888;
  padding:1px 7px;border-radius:99px;font-weight:700}
.sb-day.active .sb-day-cnt{background:var(--green);color:#fff}
.sb-stats{padding:12px 14px 16px;border-top:1px solid #222}
.sb-stats-lbl{font-size:9px;color:#555;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}
.sb-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.sstat{background:#212121;border-radius:6px;padding:6px 4px;text-align:center}
.sstat.h{background:#2e1515}
.sstat.m{background:#2e2510}
.sstat.l{background:#0f1e2e}
.sstat-n{font-size:18px;font-weight:800;line-height:1.1}
.sstat.h .sstat-n{color:#f87171}
.sstat.m .sstat-n{color:#fbbf24}
.sstat.l .sstat-n{color:#60a5fa}
.sstat-t{font-size:9px;color:#666;margin-top:1px}

/* ════════ MOBILE TOP HEADER ════════ */
#mobile-header{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:300;
  background:var(--green);color:#fff;
  display:flex;align-items:center;padding:0 16px;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mh-icon{width:28px;height:28px;background:rgba(255,255,255,.2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.mh-title{font-size:15px;font-weight:700;flex:1}
.mh-updated{font-size:10px;opacity:.75;text-align:right}

/* ════════ MOBILE DAY TABS ════════ */
#mobile-days{
  position:fixed;top:var(--topbar);left:0;right:0;height:var(--daytab);z-index:299;
  background:#fff;border-bottom:2px solid #e8e8e8;
  display:flex;align-items:center;overflow-x:auto;gap:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 4px}
#mobile-days::-webkit-scrollbar{display:none}
.mday{flex-shrink:0;padding:0 14px;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border-bottom:3px solid transparent;gap:1px;min-width:64px;
  transition:all .15s;color:#888}
.mday.active{border-bottom-color:var(--green);color:var(--green)}
.mday-lbl{font-size:12px;font-weight:700;line-height:1}
.mday-cnt{font-size:10px;background:#f0f0f0;color:#aaa;
  padding:0 6px;border-radius:99px;line-height:1.6;font-weight:600}
.mday.active .mday-cnt{background:var(--green);color:#fff}

/* ════════ FILTER / SEARCH BAR ════════ */
#filterbar{
  position:fixed;z-index:290;background:rgba(242,242,237,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid #ddd;
  display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none}
#filterbar::-webkit-scrollbar{display:none}
.fbtn{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;
  border:1.5px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap;
  color:#666;transition:all .15s;flex-shrink:0}
.fbtn:hover{border-color:#aaa}
.fbtn.fa{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.fbtn.fh{background:var(--high-bg);color:var(--high-col);border-color:var(--high-brd)}
.fbtn.fm{background:var(--med-bg);color:var(--med-col);border-color:var(--med-brd)}
.fbtn.fl{background:var(--low-bg);color:var(--low-col);border-color:var(--low-brd)}
#searchbox{flex-shrink:0;padding:6px 14px;border-radius:99px;border:1.5px solid #ddd;
  font-size:13px;outline:none;background:#fff;min-width:0;
  margin-left:auto;transition:border .15s}
#searchbox:focus{border-color:var(--green)}

/* ════════ MAIN CONTENT ════════ */
#main{padding-bottom:30px}
#cards{padding:12px 14px}
.day-hd{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#aaa;margin:4px 0 12px}
.empty{text-align:center;color:#ccc;padding:60px 20px;font-size:14px}

/* ════════ CARD ════════ */
.card{background:#fff;border-radius:12px;border:1px solid #e8e8e8;
  margin-bottom:11px;overflow:hidden;cursor:pointer;
  transition:box-shadow .2s,border-color .2s;-webkit-user-select:none;user-select:none}
.card:active{opacity:.95}
.card.open{border-color:#c8c8c8;box-shadow:0 4px 18px rgba(0,0,0,.09)}

.c-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;
  padding:9px 13px 8px;background:#fafafa;border-bottom:1px solid #f0f0f0;font-size:12px}
.c-market{font-weight:700;color:#333}
.c-sep{color:#ddd}
.c-src{color:#888}
.c-date{color:#bbb;margin-left:auto;font-size:11px}

.c-impact{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:7px 13px;border-bottom:1px solid #f5f5f5}
.ibadge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:5px}
.ibadge.high{background:var(--high-bg);color:var(--high-col)}
.ibadge.medium{background:var(--med-bg);color:var(--med-col)}
.ibadge.low{background:var(--low-bg);color:var(--low-col)}
.area-sep{font-size:10px;color:#ddd}
.atag{font-size:10.5px;background:#f3f3f3;color:#555;
  padding:2px 7px;border-radius:4px;font-weight:500}

.c-body{padding:11px 13px 12px}
.c-hl-lbl{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#ccc;margin-bottom:3px}
.c-hl{font-size:15px;font-weight:700;color:var(--green);line-height:1.4;padding-right:20px;position:relative}
.chevron{position:absolute;right:0;top:2px;font-size:14px;color:#ccc;transition:transform .2s}
.card.open .chevron{transform:rotate(180deg)}

.c-detail{display:none;padding:0 13px 14px;border-top:1px solid #f5f5f5;margin-top:10px}
.card.open .c-detail{display:block}
.blbl{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#ccc;margin-top:12px;margin-bottom:4px}
.btxt{font-size:13.5px;color:#333;line-height:1.65}
.why{background:var(--green-light);border-left:3px solid var(--green);
  border-radius:0 7px 7px 0;padding:10px 13px;margin-top:4px}
.why p{font-size:13px;color:#1a3d2e;line-height:1.65}
.plist{list-style:none;padding:0;margin-top:4px}
.plist li{font-size:13.5px;color:#333;padding:3px 0 3px 18px;position:relative;line-height:1.55}
.plist li::before{content:'•';position:absolute;left:5px;color:var(--green);font-weight:700}
.slinks{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.slink{font-size:11.5px;color:var(--green);text-decoration:none;
  background:var(--green-light);padding:4px 10px;border-radius:5px;
  border:1px solid #c3e6d8;transition:background .15s}
.slink:active{background:#c3e6d8}

/* ════════ LOADING ════════ */
#loading{position:fixed;inset:0;background:#f2f2ed;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;gap:14px}
.spin{width:38px;height:38px;border:3px solid #e8e8e8;
  border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:#aaa}

/* ════════ RESPONSIVE: DESKTOP ════════ */
@media(min-width:768px){
  #mobile-header,#mobile-days{display:none}
  #sidebar{display:flex}
  #filterbar{left:var(--sidebar);top:0;padding:10px 20px}
  #main{margin-left:var(--sidebar)}
  #cards{padding:16px 20px;max-width:820px}
  #searchbox{width:180px}
  body{font-size:14px}
}

/* ════════ RESPONSIVE: MOBILE ════════ */
@media(max-width:767px){
  #sidebar{display:none}
  #filterbar{top:calc(var(--topbar) + var(--daytab));left:0;right:0;padding:7px 12px}
  #main{padding-top:calc(var(--topbar) + var(--daytab) + 52px)}
  #searchbox{width:140px;font-size:12px;padding:5px 11px}
  .fbtn{font-size:11px;padding:4px 10px}
}

/* safe area for notch phones */
@supports(padding:max(0px)){
  #mobile-header{padding-left:max(16px,env(safe-area-inset-left));
    padding-right:max(16px,env(safe-area-inset-right))}
  #cards{padding-bottom:max(30px,env(safe-area-inset-bottom))}
}

/* scrollbar */
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spin"></div>
  <div class="load-txt">載入新聞簡報中…</div>
</div>

<!-- Mobile header -->
<header id="mobile-header">
  <div class="mh-icon">☕</div>
  <div class="mh-title">SBUX 供應商簡報</div>
  <div class="mh-updated" id="mh-updated"></div>
</header>

<!-- Mobile day tabs -->
<nav id="mobile-days"></nav>

<!-- Desktop sidebar -->
<aside id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-row">
      <div class="sb-icon">☕</div>
      <div class="sb-name">SBUX 每日簡報</div>
    </div>
  </div>
  <div class="sb-sub" id="sb-updated"></div>
  <div class="sb-days" id="sb-days"></div>
  <div class="sb-stats">
    <div class="sb-stats-lbl">今日統計</div>
    <div class="sb-stats-grid">
      <div class="sstat h"><div class="sstat-n" id="cnt-h">0</div><div class="sstat-t">🔥 高</div></div>
      <div class="sstat m"><div class="sstat-n" id="cnt-m">0</div><div class="sstat-t">⚠️ 中</div></div>
      <div class="sstat l"><div class="sstat-n" id="cnt-l">0</div><div class="sstat-t">ℹ️ 低</div></div>
    </div>
  </div>
</aside>

<!-- Filter bar -->
<div id="filterbar">
  <button class="fbtn fa" onclick="setFilter('all',this)">全部</button>
  <button class="fbtn" onclick="setFilter('high',this)">🔥 高衝擊</button>
  <button class="fbtn" onclick="setFilter('medium',this)">⚠️ 中衝擊</button>
  <button class="fbtn" onclick="setFilter('low',this)">ℹ️ 低衝擊</button>
  <input id="searchbox" type="search" placeholder="🔍 搜尋…" oninput="onSearch(this.value)">
</div>

<!-- Main -->
<main id="main">
  <div id="cards"></div>
</main>

// ── State ────────────────────────────────────────────────────────────────────
let DATA = null, activeDate = '', activeFilter = 'all', searchQ = '';

// ── Boot: try fetch first, fallback to embedded ──────────────────────────────
(function(){
  function init(data){
    DATA = data;
    activeDate = DATA.days[0]?.date || '';
    document.getElementById('loading').style.display = 'none';
    renderAll();
  }

  if (location.protocol.startsWith('http')) {
    fetch('./sbux_news_data.json?v=' + Date.now())
      .then(r => r.json())
      .then(init)
      .catch(() => init(FALLBACK));
  } else {
    setTimeout(() => init(FALLBACK), 400); // slight delay for nicer UX
  }
})();

// ── Render all ───────────────────────────────────────────────────────────────
function renderAll(){
  renderSidebar();
  renderMobileHeader();
  renderMobileDays();
  renderCards();
}

// ── Desktop sidebar ──────────────────────────────────────────────────────────
function renderSidebar(){
  document.getElementById('sb-updated').textContent = '最後更新：' + DATA.lastUpdated;
  const wrap = document.getElementById('sb-days');
  wrap.innerHTML = DATA.days.map(d => {
    const active = d.date === activeDate;
    const label = formatDateLabel(d.date, DATA.lastUpdated);
    return `<div class="sb-day${active?' active':''}" onclick="setDay('${d.date}')">
      <div><div class="sb-day-name">${label}</div></div>
      <span class="sb-day-cnt">${d.items.length}</span>
    </div>`;
  }).join('');
  updateStats();
}

// ── Mobile header ────────────────────────────────────────────────────────────
function renderMobileHeader(){
  document.getElementById('mh-updated').textContent = DATA.lastUpdated;
}

// ── Mobile day tabs ──────────────────────────────────────────────────────────
function renderMobileDays(){
  const nav = document.getElementById('mobile-days');
  nav.innerHTML = DATA.days.map(d => {
    const active = d.date === activeDate;
    const label = formatDateLabel(d.date, DATA.lastUpdated);
    return `<div class="mday${active?' active':''}" onclick="setDay('${d.date}')">
      <div class="mday-lbl">${label}</div>
      <div class="mday-cnt">${d.items.length}</div>
    </div>`;
  }).join('');
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats(){
  const day = DATA.days.find(d => d.date === activeDate);
  const items = day ? day.items : [];
  document.getElementById('cnt-h').textContent = items.filter(i=>i.impact==='high').length;
  document.getElementById('cnt-m').textContent = items.filter(i=>i.impact==='medium').length;
  document.getElementById('cnt-l').textContent = items.filter(i=>i.impact==='low').length;
}

// ── Cards ────────────────────────────────────────────────────────────────────
function renderCards(){
  const day = DATA.days.find(d => d.date === activeDate);
  const wrap = document.getElementById('cards');
  if (!day) { wrap.innerHTML='<div class="empty">暫無資料</div>'; return; }

  let items = day.items;
  if (activeFilter !== 'all') items = items.filter(i => i.impact === activeFilter);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    items = items.filter(i =>
      i.headline.toLowerCase().includes(q) ||
      i.summary.toLowerCase().includes(q) ||
      i.market.toLowerCase().includes(q) ||
      (i.impactAreas||[]).some(a=>a.toLowerCase().includes(q))
    );
  }

  const dateObj = new Date(day.date+'T00:00:00');
  const isToday = day.date === DATA.lastUpdated;
  const m = (dateObj.getMonth()+1).toString().padStart(2,'0');
  const d2 = dateObj.getDate().toString().padStart(2,'0');
  const hd = (isToday ? '今天・' : '') + dateObj.getFullYear() + ' / ' + m + ' / ' + d2;

  if (!items.length){
    wrap.innerHTML = `<div class="day-hd">${hd}</div><div class="empty">此篩選條件下無新聞</div>`;
    return;
  }
  wrap.innerHTML = `<div class="day-hd">${hd}</div>` + items.map(cardHTML).join('');
  updateStats();
}

function cardHTML(it){
  const areas = (it.impactAreas||[]).map(a=>`<span class="atag">${a}</span>`).join('');
  const impacts = (it.potentialImpact||[]).map(p=>`<li>${p}</li>`).join('');
  const sources = (it.sourceLinks||[]).map(s=>
    `<a class="slink" href="${s.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📰 ${s.label}</a>`
  ).join('');
  return `<div class="card" id="c-${it.id}" onclick="toggleCard('${it.id}')">
  <div class="c-meta">
    <span class="c-market">${it.market}</span><span class="c-sep">|</span>
    <span class="c-src">${it.source}</span><span class="c-date">${it.pubDate}</span>
  </div>
  <div class="c-impact">
    <span class="ibadge ${it.impact}">${it.impactLabel}</span>
    <span class="area-sep">影響範疇：</span>${areas}
  </div>
  <div class="c-body">
    <div class="c-hl-lbl">標題</div>
    <div class="c-hl">${it.headline}<span class="chevron">▾</span></div>
    <div class="c-detail">
      <div class="blbl">摘要</div><div class="btxt">${it.summary}</div>
      <div class="blbl">為什麼重要</div>
      <div class="why"><p>${it.whyMatters}</p></div>
      <div class="blbl">潛在影響</div>
      <ul class="plist">${impacts}</ul>
      <div class="slinks">${sources}</div>
    </div>
  </div>
</div>`;
}

// ── Interactions ─────────────────────────────────────────────────────────────
function toggleCard(id){
  document.getElementById('c-'+id)?.classList.toggle('open');
}
function setDay(date){
  activeDate = date;
  renderSidebar();
  renderMobileDays();
  renderCards();
  document.getElementById('cards').scrollIntoView({behavior:'smooth',block:'start'});
}
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.className='fbtn');
  const cls = {all:'fa',high:'fh',medium:'fm',low:'fl'}[f];
  btn.className = 'fbtn ' + cls;
  renderCards();
}
function onSearch(v){ searchQ=v.trim(); renderCards(); }

// ── Helpers ──────────────────────────────────────────────────────────────────
function formatDateLabel(date, latest){
  if (date === latest) return '今天';
  const d = new Date(date+'T00:00:00');
  return (d.getMonth()+1).toString().padStart(2,'0') + '/' + d.getDate().toString().padStart(2,'0');
}
</script>
</body>
</html>
